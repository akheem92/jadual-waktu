<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Jadual Waktu & Guru Ganti Pintar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{background-image:radial-gradient(circle at 20% 0,rgba(34,211,238,.08),transparent 40%),radial-gradient(circle at 90% 10%,rgba(236,72,153,.07),transparent 35%)}
  .tab-btn.active{color:#22d3ee;border-color:#22d3ee;box-shadow:0 2px 12px -4px #22d3ee}
  .sess-btn.active{background:rgba(34,211,238,.2);color:#67e8f9;box-shadow:0 0 12px rgba(34,211,238,.35)}
  input,select{color-scheme:dark}
  @media print{.no-print{display:none!important}body{background:#fff}}
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<header class="no-print sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
    <div class="flex items-center gap-3 min-w-0">
      <img id="hdr-logo" class="h-10 w-10 rounded-lg object-contain hidden bg-slate-900" alt="">
      <div class="min-w-0">
        <div id="hdr-school" class="font-bold text-cyan-400 truncate">Sistem Jadual Waktu Pintar</div>
        <div id="hdr-sub" class="text-xs text-slate-500">Gaya aSc Timetables</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex rounded-lg border border-slate-700 overflow-hidden" id="sess-switch">
        <button class="sess-btn px-4 py-1.5 text-sm" data-sess="Pagi">☀ Sesi Pagi</button>
        <button class="sess-btn px-4 py-1.5 text-sm" data-sess="Petang">🌙 Sesi Petang</button>
      </div>
      <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-pink-500" title="Tidak bersambung"></span>
      <button data-act="openConn" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:border-amber-400 text-amber-400 text-sm flex items-center gap-1"><i data-lucide="plug" class="w-4 h-4"></i><span class="hidden sm:inline">Supabase</span></button>
    </div>
  </div>
  <nav class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto text-sm">
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t1">1. Profil & Loceng</button>
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t2">2. Guru, Kelas & Subjek</button>
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t3">3. Agihan Tugas</button>
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t4">4. Papan Jadual</button>
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t5">5. Guru Ganti</button>
    <button class="tab-btn px-4 py-2 border-b-2 border-transparent whitespace-nowrap" data-tab="t6">6. Cetakan</button>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <section id="tab-t1" class="tab-pane"></section>
  <section id="tab-t2" class="tab-pane hidden"></section>
  <section id="tab-t3" class="tab-pane hidden"></section>
  <section id="tab-t4" class="tab-pane hidden">
    <div id="jadual-container"></div>
  </section>
  <section id="tab-t5" class="tab-pane hidden">
    <div id="relief-container"></div>
  </section>
  <section id="tab-t6" class="tab-pane hidden">
    <div id="cetak-container"></div>
  </section>
</main>

<!-- Modal Tetapan Sambungan Supabase -->
<div id="conn-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/70 p-4">
  <div class="bg-slate-900 border border-cyan-400/40 rounded-xl p-5 w-full max-w-lg shadow-[0_0_30px_-8px_#22d3ee]">
    <h3 class="text-lg font-bold text-cyan-400 mb-1">Tetapan Sambungan Supabase</h3>
    <p class="text-xs text-slate-400 mb-4">Disimpan dalam localStorage pelayar ini sahaja. Gunakan kunci awam (anon / publishable) — jangan sekali-kali service_role.</p>
    <label class="text-xs text-slate-400">SUPABASE_URL</label>
    <input id="conn-url" class="w-full mb-3 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-cyan-400 outline-none" placeholder="https://xxxx.supabase.co">
    <label class="text-xs text-slate-400">SUPABASE_ANON_KEY</label>
    <input id="conn-key" class="w-full mb-4 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-cyan-400 outline-none" placeholder="eyJ... / sb_publishable_...">
    <div class="flex flex-wrap justify-end gap-2">
      <button data-act="resetConn" class="px-3 py-1.5 rounded-lg border border-pink-500/50 text-pink-400 text-sm">Set Semula</button>
      <button data-act="closeConn" class="px-3 py-1.5 rounded-lg border border-slate-600 text-sm">Tutup</button>
      <button data-act="saveConn" class="px-3 py-1.5 rounded-lg bg-cyan-500/20 border border-cyan-400/60 text-cyan-300 text-sm">Simpan & Sambung</button>
    </div>
  </div>
</div>

<div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>
<script src="app.js"></script>
</body>
</html>
